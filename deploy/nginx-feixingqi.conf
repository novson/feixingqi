# 放在 /etc/nginx/default.d/feixingqi.conf
# 与 poker-game 共用 80 端口，用 /feixingqi/ 前缀区分，不影响现有站点。

location /feixingqi/api/ {
    # 注意：proxy_pass 带 URI 时会替换掉匹配前缀，这里要补回 /api/
    proxy_pass http://127.0.0.1:18090/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /feixingqi/ws {
    proxy_pass http://127.0.0.1:18090/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location /feixingqi/ {
    alias /opt/feixingqi/web/dist/;
    index index.html;
    try_files $uri $uri/ /feixingqi/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
}
